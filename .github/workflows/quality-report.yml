name: Quality report release
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Completed CI run ID from this repository's current main commit
        required: true
        type: string
      publish:
        description: Publish after preparation (also requires repository enablement and bundle review)
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-report-main
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  TZ: UTC
jobs:
  prepare:
    name: Prepare trusted quality report
    if: >-
      github.repository == 'Shaobangzhu/delivery-geo-intelligence' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.0
      - run: npm ci
      - name: Verify source workflow, repository, event, branch and current main SHA
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: node scripts/allure/release.mjs source
      - name: Download actual CI report and audited results from verified run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: consolidated-test-report
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: artifacts/ci-source/
      - name: Restore latest available trusted main history (no PR artifacts)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/allure/release.mjs restore
      - name: Generate actual Allure HTML with history and strict publication projection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/allure/release.mjs build
      - name: Retain bounded sanitized history independently of Cloudflare
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-report-history-main
          retention-days: 90
          overwrite: true
          if-no-files-found: error
          path: |
            artifacts/allure-history/history.jsonl
            artifacts/allure-history/manifest.json
      - name: Upload audited static publication candidate (no logs or raw results)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-report-publication
          retention-days: 7
          overwrite: true
          if-no-files-found: error
          path: |
            artifacts/allure-publish/
            artifacts/publication-manifest.json
      - name: Explain default dry run
        if: vars.QUALITY_REPORT_DEPLOY_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        run: echo 'Candidate/history retained; publication disabled. No Cloudflare credentials were accessed.'
  deploy:
    name: Publish quality report to Cloudflare Pages
    needs: prepare
    if: >-
      github.repository == 'Shaobangzhu/delivery-geo-intelligence' && github.ref == 'refs/heads/main' &&
      vars.QUALITY_REPORT_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_run' || inputs.publish == true)
    environment: quality-report-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.0
      - run: npm ci
      - name: Enforce dependency security policy before credentialed upload
        run: npm run security:check
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: quality-report-publication
          path: artifacts/
      - name: Recheck all publication bytes before credentialed upload
        run: npm run allure:publish:check
      - name: Deploy only the audited report directory with locked Wrangler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_REPORT_DEPLOY_ENABLED: ${{ vars.QUALITY_REPORT_DEPLOY_ENABLED }}
          QUALITY_REPORT_BUNDLE_SHA256: ${{ vars.QUALITY_REPORT_BUNDLE_SHA256 }}
          QUALITY_REPORT_BUNDLE_REVIEW_EXPIRES: ${{ vars.QUALITY_REPORT_BUNDLE_REVIEW_EXPIRES }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run allure:publish:deploy
